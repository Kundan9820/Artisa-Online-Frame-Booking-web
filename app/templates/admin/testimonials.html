{% extends "admin/base.html" %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Testimonials</h2>
  <a href="{{ url_for('admin.add_testimonial') }}" class="btn btn-primary-brand">+ Add Testimonial</a>
</div>
<div class="row g-3">
  {% for t in testimonials %}
  <div class="col-md-4">
    <div class="card-brand p-3">
      {% if t.image %}<img src="{{ url_for('static', filename=t.image) }}" style="width:50px;height:50px;object-fit:cover;" class="rounded-circle mb-2">{% endif %}
      <p class="mb-1"><strong>{{ t.customer_name }}</strong> — {{ "★" * t.rating }}</p>
      <p class="small">{{ t.comment }}</p>
      <form action="{{ url_for('admin.delete_testimonial', t_id=t.id) }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm btn-outline-danger w-100">Delete</button>
      </form>
    </div>
  </div>
  {% else %}
  <p class="text-muted">No testimonials yet.</p>
  {% endfor %}
</div>
{% endblock %}
