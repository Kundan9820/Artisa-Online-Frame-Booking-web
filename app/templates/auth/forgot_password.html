{% extends "base.html" %}
{% block title %}Forgot Password — {{ site.shop_name }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card-brand p-4 mx-auto frame-corner" style="max-width:420px;">
    <h3 class="mb-3">Reset Your Password</h3>
    <form method="post">
      {{ form.hidden_tag() }}
      <div class="mb-3">{{ form.email.label(class_="form-label") }}{{ form.email(class_="form-control form-control-brand") }}</div>
      <button type="submit" class="btn btn-primary-brand w-100">Send Reset Link</button>
    </form>
  </div>
</div>
{% endblock %}
